# Publishes main only. The earlier /preview/ branch is no longer deployed,
# so the client-name check below covers everything that goes live.
# Manual publishing only. Branch pushes never deploy this workflow.
name: Publish portfolio

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install check tools
        run: npm ci

      - name: Check links, layout, accessibility and client names
        run: npm run verify

      - name: Collect only the public files
        run: |
          mkdir pages-dist
          cp -R index.html assets projects evidence pages-dist/

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
